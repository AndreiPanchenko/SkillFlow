<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ошибка - SkillFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">
      <i class="fas fa-graduation-cap me-2"></i>SkillFlow
    </a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-danger">
        <div class="card-header bg-danger text-white">
          <h5 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Ошибка сервера</h5>
        </div>
        <div class="card-body">
          <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading">Произошла внутренняя ошибка сервера</h4>
            <hr>
            <p>Пожалуйста, попробуйте снова или обратитесь к администратору.</p>
            <div th:if="${errorMessage}">
              <strong>Детали ошибки:</strong>
              <p th:text="${errorMessage}"></p>
            </div>
          </div>
          <div class="d-grid gap-2">
            <a href="javascript:history.back()" class="btn btn-primary">
              <i class="fas fa-arrow-left me-2"></i>Вернуться назад
            </a>
            <a th:href="@{/}" class="btn btn-secondary">
              <i class="fas fa-home me-2"></i>На главную
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
